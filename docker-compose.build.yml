# Builds every service image in one BuildKit session (ci.yml, on main and release tags):
#
#   REPO=ghcr.io/rdmse/rdws_us IMAGE_TAG=<sha> RDWS_VERSION=<version> \
#     docker compose -f docker-compose.build.yml build
#
# One `compose build` resolves the Dockerfile once and reuses the builder stage CI just built
# for all twelve images. Twelve separate `docker build` runs in parallel took 9 min 23 s on the
# runner instead (each its own session, competing for the QA host). Nothing here runs: the
# deploys pull these images (docker-compose.qa-app.yml, docker-compose.prod-app.yml).
name: rdws_build

x-image: &image
  context: .
  target: runtime

services:
  service_gateway_http:
    build: { <<: *image, args: { SERVICE: service_gateway_http, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/service_gateway_http:${IMAGE_TAG:?}
  auth_service:
    build: { <<: *image, args: { SERVICE: auth_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/auth_service:${IMAGE_TAG:?}
  farm_service:
    build: { <<: *image, args: { SERVICE: farm_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/farm_service:${IMAGE_TAG:?}
  field_service:
    build: { <<: *image, args: { SERVICE: field_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/field_service:${IMAGE_TAG:?}
  device_service:
    build: { <<: *image, args: { SERVICE: device_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/device_service:${IMAGE_TAG:?}
  device_config_service:
    build: { <<: *image, args: { SERVICE: device_config_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/device_config_service:${IMAGE_TAG:?}
  sensor_service:
    build: { <<: *image, args: { SERVICE: sensor_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/sensor_service:${IMAGE_TAG:?}
  sensor_reading_service:
    build: { <<: *image, args: { SERVICE: sensor_reading_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/sensor_reading_service:${IMAGE_TAG:?}
  persistence_service:
    build: { <<: *image, args: { SERVICE: persistence_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/persistence_service:${IMAGE_TAG:?}
  ingestion_service:
    build: { <<: *image, args: { SERVICE: ingestion_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/ingestion_service:${IMAGE_TAG:?}
  reading_writer_service:
    build: { <<: *image, args: { SERVICE: reading_writer_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/reading_writer_service:${IMAGE_TAG:?}
  sensor_simulator_service:
    build: { <<: *image, args: { SERVICE: sensor_simulator_service, RDWS_VERSION: "${RDWS_VERSION:-}" } }
    image: ${REPO:?}/sensor_simulator_service:${IMAGE_TAG:?}

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs from the QA compose containers, via Docker service discovery — no need to
  # change anything in logger.cpp (the services already write to stdout, captured by Docker).
  # Also the simulator containers, which scripts/qa_simulators.sh runs outside the compose
  # and tags with rdws.env / rdws.service. One docker_sd_config per label: the Docker API
  # ANDs the values of a `label` filter, so listing both in one filter matches no container.
  - job_name: docker_qa
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=rdws_qa"]
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["rdws.env=qa"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "compose_service"
      - source_labels: ["__meta_docker_container_label_rdws_service"]
        regex: "(.+)"
        target_label: "compose_service"
      - replacement: "qa"
        target_label: "env"

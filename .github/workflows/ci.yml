name: CI

on:
  push:
    branches: [main]
    tags: ['v*'] # a release (README, "Versões"): images also get the version tag
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, homelab, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # tags, for scripts/rdws_version.sh

      # Before the build: seconds, and a wrong/missing license header fails the PR (README, "Licença")
      - name: Check SPDX license headers
        run: scripts/check_spdx.sh

      - name: Version of the solution
        run: echo "RDWS_VERSION=$(scripts/rdws_version.sh)" >> "$GITHUB_ENV"

      - name: Build builder stage (build and prepare tests)
        run: |
          echo "version: $RDWS_VERSION"
          docker build --target builder --build-arg RDWS_VERSION="$RDWS_VERSION" \
            -t rdws_us-builder:${{ github.sha }} .

      - name: Run ctest
        run: |
          docker run --rm rdws_us-builder:${{ github.sha }} \
            ctest --test-dir build --output-on-failure

      # rdws_us as a dependency of another project (the private repo of the open-core split):
      # only the shared libraries, linked by a minimal service (tests/consumer). Reuses the
      # dependencies the builder already fetched.
      - name: Consumer smoke test (RDWS_SHARED_ONLY)
        run: |
          docker run --rm rdws_us-builder:${{ github.sha }} bash -c \
            'cmake -S tests/consumer -B /tmp/consumer -DFETCHCONTENT_BASE_DIR=/src/build/_deps \
             && cmake --build /tmp/consumer -j"$(nproc)" && /tmp/consumer/hello'

      - name: Build runtime image (validate complete multi-stage)
        run: |
          docker build --build-arg RDWS_VERSION="$RDWS_VERSION" -t rdws_us-gateway:${{ github.sha }} .

      - name: Clean up local images
        if: always()
        run: |
          docker image rm rdws_us-builder:${{ github.sha }} rdws_us-gateway:${{ github.sha }} || true

  push-ghcr:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, homelab, docker]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - service_gateway_http
          - auth_service
          - farm_service
          - field_service
          - device_service
          - device_config_service
          - sensor_service
          - sensor_reading_service
          - persistence_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # tags, for scripts/rdws_version.sh

      - name: Version of the solution
        run: echo "RDWS_VERSION=$(scripts/rdws_version.sh)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}
          docker build --build-arg SERVICE=${{ matrix.service }} \
            --build-arg RDWS_VERSION="$RDWS_VERSION" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:qa" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:qa"
          docker push "$IMAGE:latest"
          # On a release tag, the image also gets the version (vX.Y.Z)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
            docker push "$IMAGE:${{ github.ref_name }}"
          fi

      - name: Clean up local images
        if: always()
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}
          docker image rm "$IMAGE:${{ github.sha }}" "$IMAGE:qa" "$IMAGE:latest" \
            "$IMAGE:${{ github.ref_name }}" 2>/dev/null || true

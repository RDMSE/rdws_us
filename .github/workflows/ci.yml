name: CI

on:
  push:
    branches: [main]
    tags: ['v*'] # a release (README, "Versões"): images also get the version tag
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, homelab, docker]
    permissions:
      contents: read
      packages: write # the service images, on main and on release tags
    env:
      # Every service image: the 9 HTTP-facing ones plus ingestion, writer and simulator, which
      # the QA deploy used to build itself. Each is the runtime stage over the same builder.
      SERVICES: >-
        service_gateway_http auth_service farm_service field_service device_service
        device_config_service sensor_service sensor_reading_service persistence_service
        ingestion_service reading_writer_service sensor_simulator_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # tags, for scripts/rdws_version.sh

      # Before the build: seconds, and a wrong/missing license header fails the PR (README, "Licença")
      - name: Check SPDX license headers
        run: scripts/check_spdx.sh

      - name: Version of the solution
        run: echo "RDWS_VERSION=$(scripts/rdws_version.sh)" >> "$GITHUB_ENV"

      - name: Build builder stage (build and prepare tests)
        run: |
          echo "version: $RDWS_VERSION"
          docker build --target builder --build-arg RDWS_VERSION="$RDWS_VERSION" \
            -t rdws_us-builder:${{ github.sha }} .

      - name: Run ctest
        run: |
          docker run --rm rdws_us-builder:${{ github.sha }} \
            ctest --test-dir build --output-on-failure

      # rdws_us as a dependency of another project (the private repo of the open-core split):
      # only the shared libraries, linked by a minimal service (tests/consumer). Reuses the
      # dependencies the builder already fetched.
      - name: Consumer smoke test (RDWS_SHARED_ONLY)
        run: |
          docker run --rm rdws_us-builder:${{ github.sha }} bash -c \
            'cmake -S tests/consumer -B /tmp/consumer -DFETCHCONTENT_BASE_DIR=/src/build/_deps \
             && cmake --build /tmp/consumer -j"$(nproc)" && /tmp/consumer/hello'

      - name: Build runtime image (validate complete multi-stage)
        run: |
          docker build --build-arg RDWS_VERSION="$RDWS_VERSION" -t rdws_us-gateway:${{ github.sha }} .

      # Built once, here, from the builder already in the cache: the QA deploy pulls these
      # instead of building (README, "Versões"). All in one BuildKit session
      # (docker-compose.build.yml): twelve separate `docker build` runs in parallel took
      # 9 min 23 s. The extra tags are local aliases; the pushes run in parallel.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the service images
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          REPO=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${{ github.sha }} qa latest"
          # On a release tag the images also get the version (vX.Y.Z)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then TAGS="$TAGS ${{ github.ref_name }}"; fi

          # The build log stays in the job log, folded: what to look at when this gets slow
          echo "::group::docker compose build (all service images)"
          time REPO="$REPO" IMAGE_TAG="${{ github.sha }}" RDWS_VERSION="$RDWS_VERSION" \
            BUILDKIT_PROGRESS=plain docker compose -f docker-compose.build.yml build
          echo "::endgroup::"
          for svc in $SERVICES; do
            for t in $TAGS; do
              [[ "$t" == "${{ github.sha }}" ]] || docker tag "$REPO/$svc:${{ github.sha }}" "$REPO/$svc:$t"
            done
          done

          push_image() { for t in $TAGS; do docker push --quiet "$REPO/$1:$t"; done; }
          pids=(); names=(); failed=0
          for svc in $SERVICES; do
            ( push_image "$svc" > "/tmp/push-$svc.log" 2>&1 ) & pids+=($!); names+=("$svc")
          done
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::push failed for ${names[$i]}"; cat "/tmp/push-${names[$i]}.log"; failed=1
            fi
          done
          exit $failed

      - name: Clean up local images
        if: always()
        run: |
          docker image rm rdws_us-builder:${{ github.sha }} rdws_us-gateway:${{ github.sha }} || true
          REPO=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          for svc in $SERVICES; do
            for t in "${{ github.sha }}" "${{ github.ref_name }}"; do
              docker image rm "$REPO/$svc:$t" 2>/dev/null || true
            done
          done


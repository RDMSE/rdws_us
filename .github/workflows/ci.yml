name: CI

on:
  push:
    branches: [main]
    tags: ['v*'] # a release (README, "Versões"): images also get the version tag
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, homelab, docker]
    permissions:
      contents: read
      packages: write # the service images, on main and on release tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # tags, for scripts/rdws_version.sh

      # Before the build: seconds, and a wrong/missing license header fails the PR (README, "Licença")
      - name: Check SPDX license headers
        run: scripts/check_spdx.sh

      - name: Version of the solution
        run: echo "RDWS_VERSION=$(scripts/rdws_version.sh)" >> "$GITHUB_ENV"

      - name: Build builder stage (build and prepare tests)
        run: |
          echo "version: $RDWS_VERSION"
          docker build --target builder --build-arg RDWS_VERSION="$RDWS_VERSION" \
            -t rdws_us-builder:${{ github.sha }} .

      - name: Run ctest
        run: |
          docker run --rm rdws_us-builder:${{ github.sha }} \
            ctest --test-dir build --output-on-failure

      # rdws_us as a dependency of another project (the private repo of the open-core split):
      # only the shared libraries, linked by a minimal service (tests/consumer). Reuses the
      # dependencies the builder already fetched.
      - name: Consumer smoke test (RDWS_SHARED_ONLY)
        run: |
          docker run --rm rdws_us-builder:${{ github.sha }} bash -c \
            'cmake -S tests/consumer -B /tmp/consumer -DFETCHCONTENT_BASE_DIR=/src/build/_deps \
             && cmake --build /tmp/consumer -j"$(nproc)" && /tmp/consumer/hello'

      # The one image of every service (Dockerfile): the runtime stage over the builder that just
      # passed the tests, so what the deploys run is exactly what was tested. On every event
      # (validates the multi-stage build); pushed on main and on release tags.
      - name: Build the services image
        run: |
          docker build --build-arg RDWS_VERSION="$RDWS_VERSION" -t rdws_us-services:${{ github.sha }} .

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :<sha> for the QA deploy, :qa and :latest as moving tags, :vX.Y.Z on a release. One
      # image, so the later tags only add a manifest on the registry.
      - name: Push the services image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/services
          TAGS="${{ github.sha }} qa latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then TAGS="$TAGS ${{ github.ref_name }}"; fi
          for t in $TAGS; do
            docker tag rdws_us-services:${{ github.sha }} "$IMAGE:$t"
            docker push --quiet "$IMAGE:$t"
          done

      # :qa and :latest stay on the host: the QA deploy runs on the same Docker host, so its pull
      # has nothing to download
      - name: Clean up local images
        if: always()
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/services
          docker image rm rdws_us-builder:${{ github.sha }} rdws_us-services:${{ github.sha }} \
            "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}" 2>/dev/null || true

name: Deploy QA

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        # After a release tag's CI (README, "Lançar uma versão"), `qa` is the tag's build
        description: "Image tag to deploy (a commit SHA, or qa = the latest main/release build)"
        required: true
        default: qa

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, homelab, docker]
    environment: qa
    permissions:
      contents: read
      packages: read # pull the images CI built
    env:
      # The commit CI just built and pushed; by hand, the chosen tag
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # tags, for scripts/rdws_version.sh

      - name: Generate .env.qa from environment secrets
        run: |
          cat > .env.qa <<EOF
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ vars.DB_NAME }}
          RDWS_JWT_SECRET=${{ secrets.RDWS_JWT_SECRET }}
          RDWS_JWT_ISSUER=${{ vars.RDWS_JWT_ISSUER }}
          RDWS_JWT_AUDIENCE=
          CREDENTIAL_ENCRYPTION_KEY=${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          RABBITMQ_USER=${{ vars.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          EOF
          # Version of the solution for the images' build args (README, "Versões"): only used
          # by a local `docker compose build`, the deploy pulls the images CI built
          echo "RDWS_VERSION=$(scripts/rdws_version.sh)" >> .env.qa
          # Which images: compose and scripts/qa_simulators.sh read it from this file
          echo "IMAGE_TAG=$IMAGE_TAG" >> .env.qa

      - name: Ensure QA Postgres is up
        run: docker compose -f docker-compose.qa-db.yml --env-file .env.qa up -d postgres

      - name: Run Flyway migrations
        run: docker compose -f docker-compose.qa-db.yml --env-file .env.qa --profile migrate run --rm migrate

      - name: Ensure QA RabbitMQ is up
        run: docker compose -f docker-compose.qa-mq.yml --env-file .env.qa up -d

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build here: the images are the ones CI built and pushed for this commit (ci.yml)
      - name: Pull and deploy gateway + services
        run: |
          echo "image tag: $IMAGE_TAG"
          docker compose -f docker-compose.qa-app.yml --env-file .env.qa pull
          docker compose -f docker-compose.qa-app.yml --env-file .env.qa up -d

      - name: Deploy sensor simulators (one per devices.is_simulated)
        run: scripts/qa_simulators.sh .env.qa

      # Grafana and promtail bind-mount files from this checkout (dashboards, alert rules,
      # promtail config). Bringing the compose up here keeps those mounts on the current
      # runner workspace (they were stuck on an old runner's directory once). promtail mounts
      # a single file, which the checkout replaces, so it needs a restart to see changes;
      # Grafana rescans dashboards by itself but reads provisioned alert rules only at
      # startup, so it's restarted too.
      - name: Deploy observability (Grafana dashboards and alerts, promtail config)
        run: |
          docker compose -f docker-compose.qa-observability.yml --env-file .env.qa up -d
          docker restart rdws_promtail_qa rdws_grafana_qa

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "Gateway saudável."
              exit 0
            fi
            sleep 2
          done
          echo "Gateway não respondeu saudável a tempo." >&2
          docker compose -f docker-compose.qa-app.yml --env-file .env.qa logs --tail=100
          exit 1

      # gateway_data é um volume nomeado: docker-entrypoint.sh só semeia routes.json a
      # partir da imagem se o arquivo ainda não existir no volume, pra não sobrescrever
      # CRUD de rotas feito em runtime (POST/PUT/DELETE /routes). Isso significa que uma
      # rota nova commitada no routes.json nunca chega sozinha num gateway já deployado
      # — este passo fecha essa lacuna de forma idempotente (só cria o que falta, nunca
      # sobrescreve o que já existe).
      # /routes exige identidade admin: o script faz login com estas credenciais.
      - name: Sync routes.json into gateway
        env:
          RDWS_ADMIN_USER: ${{ secrets.RDWS_ADMIN_USER }}
          RDWS_ADMIN_PASSWORD: ${{ secrets.RDWS_ADMIN_PASSWORD }}
        run: python3 scripts/sync_gateway_routes.py routes.json http://localhost:3001

      - name: Clean up .env.qa
        if: always()
        run: rm -f .env.qa

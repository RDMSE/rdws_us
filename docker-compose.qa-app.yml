# Gateway + microservices for the QA environment. Lifecycle separate from the database
# (docker-compose.qa-db.yml) — redeploy (pull/up) runs only this file, without touching
# Postgres. The db compose must be running (docker-compose.qa-db.yml up -d) before
# this one, so the services can resolve "postgres" via the shared network
# (name: rdws_qa is the same in both files).
#
# Image: one for every service (ghcr.io/rdmse/rdws_us/services, see the Dockerfile), the one CI
# built and pushed (ci.yml), pulled by the deploy with IMAGE_TAG = the commit's SHA (`qa` by
# default: the latest main or release build). RDWS_SERVICE picks the binary of each container.
# The gateway's build section is there for a local `docker compose build`.
name: rdws_qa

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:-rdws_user}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não definido (ver .env.qa.example)}
  DB_NAME: ${DB_NAME:-rdws_qa}
  RDWS_ENVIRONMENT: qa

services:
  gateway:
    build: # one image for every service: building it once, here, is enough
      context: .
      target: runtime
      args:
        RDWS_VERSION: ${RDWS_VERSION:-}
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_gateway_qa
    restart: unless-stopped
    ports:
      - "8080:8080" # TCP — backends registry (ServiceGateway)
      - "3001:3001" # HTTP — gateway API
    environment:
      RDWS_SERVICE: service_gateway_http
      RDWS_AUTH_MODE: jwt
      RDWS_JWT_SECRET: ${RDWS_JWT_SECRET:?RDWS_JWT_SECRET não definido (ver .env.qa.example)}
      RDWS_JWT_ISSUER: ${RDWS_JWT_ISSUER:-}
      RDWS_JWT_AUDIENCE: ${RDWS_JWT_AUDIENCE:-}
    volumes:
      - gateway_data:/app/data
    command: ["8080", "3001", "/tmp/service_gateway.sock", "/app/data/routes.json"]

  auth_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_auth_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      RDWS_SERVICE: auth_service
      <<: *db-env
      # Mesmo segredo do gateway (RDWS_JWT_SECRET) — nome de env diferente porque o
      # auth_service lê JWT_SECRET diretamente, sem o prefixo RDWS_.
      JWT_SECRET: ${RDWS_JWT_SECRET:?RDWS_JWT_SECRET não definido (ver .env.qa.example)}
    command: ["auth_qa_001", "gateway-qa", "tcp://gateway:8080"]

  farm_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_farm_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      <<: *db-env
      RDWS_SERVICE: farm_service
    command: ["farm_qa_001", "gateway-qa", "tcp://gateway:8080"]

  field_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_field_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      <<: *db-env
      RDWS_SERVICE: field_service
    command: ["field_qa_001", "gateway-qa", "tcp://gateway:8080"]

  device_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_device_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      RDWS_SERVICE: device_service
      <<: *db-env
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY não definido (32 bytes, ver .env.qa.example)}
    command: ["device_qa_001", "gateway-qa", "tcp://gateway:8080"]

  device_config_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_device_config_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      <<: *db-env
      RDWS_SERVICE: device_config_service
    command: ["device_config_qa_001", "gateway-qa", "tcp://gateway:8080"]

  firmware_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_firmware_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      <<: *db-env
      RDWS_SERVICE: firmware_service
      FIRMWARE_IMAGES_DIR: /app/firmware
    volumes:
      # Filled by rdws_weather_node's scripts/fw_publish.sh, through a one-off container: the service
      # only reads
      - firmware_images:/app/firmware:ro
    command: ["firmware_qa_001", "gateway-qa", "tcp://gateway:8080"]

  sensor_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_sensor_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      <<: *db-env
      RDWS_SERVICE: sensor_service
    command: ["sensor_qa_001", "gateway-qa", "tcp://gateway:8080"]

  sensor_reading_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_sensor_reading_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      <<: *db-env
      RDWS_SERVICE: sensor_reading_service
    command: ["sensor_reading_qa_001", "gateway-qa", "tcp://gateway:8080"]

  persistence_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_persistence_qa
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      <<: *db-env
      RDWS_SERVICE: persistence_service
    command: ["persistence_qa_001", "gateway-qa", "tcp://gateway:8080"]

  ingestion_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_ingestion_qa
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "5684:5684/udp" # CoAP/DTLS — devices/SensorSimulatorService connect here
    environment:
      RDWS_SERVICE: ingestion_service
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-rdws_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD não definido (ver .env.qa.example)}
      INGESTION_COAP_PORT: "5684"
      # The other services get it from *db-env; without it rdws::Config falls back to "test"
      RDWS_ENVIRONMENT: qa
    command: ["ingestion_qa_001", "gateway-qa", "tcp://gateway:8080"]

  reading_writer_service:
    image: ghcr.io/rdmse/rdws_us/services:${IMAGE_TAG:-qa}
    container_name: rdws_reading_writer_qa
    restart: unless-stopped
    environment:
      RDWS_SERVICE: reading_writer_service
      <<: *db-env
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-rdws_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD não definido (ver .env.qa.example)}
    # Worker puro — sem gateway, sem argv (Plano_Ingestion.md).

volumes:
  gateway_data:
  firmware_images:
